<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Averages Meet - Floor Routine</title>
<style>
  :root{
    --ink:#3a2b52; --wall:#d7ecfb; --mat:#4b2e83; --lav:#b9a7e0;
    --btn:#7a5fd0; --btn2:#8f74e6; --good:#2fbf71; --warn:#ef8e3b; --bad:#e04f47;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    background:linear-gradient(180deg,#eef5fd,#e6eef9 60%);
    color:var(--ink);
    -webkit-user-select:none;user-select:none;
  }
  #wrap{max-width:960px;margin:0 auto;padding:14px 14px 30px}

  header{display:flex;align-items:center;justify-content:space-between;gap:14px;
    flex-wrap:wrap;margin:6px 2px 10px}
  #backlink{font-size:.7rem;font-weight:700;letter-spacing:.6px;color:#7d6ba0;
    text-decoration:none;border:2px solid #d9d2ee;background:#fff;border-radius:999px;
    padding:5px 11px;white-space:nowrap;text-transform:lowercase}
  #backlink:hover{border-color:#b9aae2;color:#5d4a92}
  h1{font-size:1.5rem;margin:0;letter-spacing:.3px}
  h1 small{display:block;font-size:.72rem;font-weight:600;color:#7d6ba0;letter-spacing:1.5px}
  #scorebox{text-align:right;background:#fff;border-radius:14px;padding:6px 16px;
    box-shadow:0 3px 10px rgba(90,70,150,.14);min-width:130px}
  #scorebox #score{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  #scorebox .of{font-size:.8rem;color:#8a7ab0;font-weight:700}
  #deduct{font-size:.72rem;color:#c05555;font-weight:700;margin-top:2px}
  #btnMode{font:inherit;font-size:.76rem;font-weight:700;color:#6d5aa8;background:#fff;
    border:2px solid #d9d2ee;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
  #btnMode:hover{border-color:#b9aae2}
  #btnMode.on{background:#6d5aa8;color:#fff;border-color:#6d5aa8}

  #pips{display:flex;gap:9px;justify-content:center;margin:4px 0 10px}
  .pip{width:17px;height:17px;border-radius:50%;background:#ccc;
    border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 4px rgba(70,50,120,.18);
    transition:background .3s,transform .3s}
  .pip.d-easy{background:#7fd6b1}.pip.d-medium{background:#f5b46a}.pip.d-hard{background:#c896e8}
  .pip.stuck{background:var(--good);transform:scale(1.12)}
  .pip.fell{background:var(--warn);transform:scale(1.12)}
  .pip.revealed{background:var(--bad);transform:scale(1.12)}

  #arena{position:relative;border-radius:20px;overflow:hidden;
    box-shadow:0 6px 22px rgba(80,60,140,.22);background:#d7ecfb}
  #scene{display:block;width:100%;height:auto}

  #banner{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(.4);
    font-size:2.3rem;font-weight:900;letter-spacing:2px;color:#fff;opacity:0;pointer-events:none;
    text-shadow:0 3px 0 rgba(70,40,130,.55), 0 8px 22px rgba(70,40,130,.35);white-space:nowrap}
  #banner.show{animation:bannerpop 1.35s ease-out both}
  @keyframes bannerpop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
    14%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
    26%{transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-62%) scale(1)}
  }

  #card{background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(80,60,140,.14);
    padding:16px 20px;margin-top:14px;min-height:120px}
  #slotline{font-size:.74rem;font-weight:800;letter-spacing:1.6px;color:#8a7ab0;margin-bottom:4px}
  #trickname{font-size:1.02rem;font-weight:800;letter-spacing:.5px;color:#5f46b0;margin-bottom:8px}
  #stmt{font-size:1.12rem;font-weight:700;line-height:1.45;margin-bottom:10px}
  .chip{display:inline-block;background:#efe9fb;color:#6a55a8;border-radius:999px;
    font-size:.72rem;font-weight:800;padding:3px 10px;margin-left:8px;vertical-align:2px}
  #answerrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #ans{font:inherit;font-size:1.35rem;font-weight:800;width:170px;padding:8px 12px;
    border:3px solid #cfc3ee;border-radius:12px;color:var(--ink);outline:none;text-align:center}
  #ans:focus{border-color:var(--btn)}
  button{font:inherit;font-weight:800;border:none;border-radius:12px;cursor:pointer;
    padding:11px 20px;color:#fff;background:var(--btn);box-shadow:0 3px 0 #5a44a8;
    transition:transform .08s}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #5a44a8}
  #btnHint{background:#8a7ab0;box-shadow:0 3px 0 #6d5e92}
  #btnReveal{background:#c05a55;box-shadow:0 3px 0 #9c4642}
  #card.lock button{opacity:.45;pointer-events:none}
  #card.lock #btnNext{opacity:1;pointer-events:auto}
  #card.lock #ans{background:#f2f0fa;color:#9a8fb8}
  #hintbox{display:none;margin-top:10px;background:#fbf6e8;border-left:5px solid #e6c26a;
    border-radius:8px;padding:9px 13px;font-size:.92rem;font-weight:600;color:#7a6534}
  #fb{display:none;margin-top:6px}
  #fbtext{font-size:1rem;font-weight:800;margin:2px 0 10px;line-height:1.4}
  #fbtext .why{display:block;font-weight:600;font-size:.9rem;color:#6a5a92;margin-top:4px}

  #endscreen{display:none;background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(80,60,140,.14);
    padding:26px 24px;margin-top:14px;text-align:center}
  #endtitle{font-size:1.9rem;font-weight:900;letter-spacing:1.5px;margin:2px 0 4px}
  #endscore{font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;margin:6px 0}
  #endline{font-size:1.02rem;font-weight:700;margin:2px 0}
  #enddetail{font-size:.9rem;color:#6a5a92;font-weight:600;margin:4px 0 16px}
  #tbline{display:flex;justify-content:center;gap:7px;margin:8px 0 16px}
  .tb{width:26px;height:26px;border-radius:6px;background:#7fd6b1}
  .tb.f{background:var(--warn)}.tb.r{background:var(--bad)}

  footer{margin-top:12px;text-align:center;font-size:.68rem;color:#a396c4;font-weight:600}

  /* phones: stacked header, full-width answer row, thumb-friendly taps;
     the boot script also switches the scene to a tighter camera angle */
  @media (max-width:640px){
    body{touch-action:manipulation}
    #wrap{padding:10px 10px 24px}
    header{gap:8px 10px}
    h1{font-size:1.2rem}
    h1 small{font-size:.62rem;letter-spacing:1.2px}
    #scorebox{padding:5px 12px;min-width:0}
    #scorebox #score{font-size:1.5rem}
    #btnMode,#backlink{font-size:.68rem;padding:6px 11px}
    #banner{font-size:1.6rem;letter-spacing:1px}
    #card{padding:14px 15px}
    #stmt{font-size:1.05rem}
    #ans{flex:1 1 100%;width:auto;font-size:1.3rem;padding:12px}
    #answerrow button{flex:1;padding:13px 12px;font-size:.98rem}
    #fb button{padding:13px 24px;font-size:.98rem}
    #endtitle{font-size:1.5rem}
    #endscore{font-size:2.4rem}
  }

  /* ---------- gymnast rig: every joint rotates about its own pivot ---------- */
  #fig, #fig g{transform-box:view-box}
  #fig{transform-origin:480px 224px}
  #fig .torsoG{transform-origin:480px 230px}
  #fig .headG {transform-origin:480px 152px}
  #fig .armF, #fig .armN{transform-origin:480px 164px}
  #fig .foreF,#fig .foreN{transform-origin:480px 190px}
  #fig .legF, #fig .legN{transform-origin:480px 230px}
  #fig .shinF,#fig .shinN{transform-origin:480px 268px}
  #shadow{transform-box:view-box;transform-origin:480px 312px}

  /* idle breathing so she never looks frozen */
  #fig.idle .armN {animation:breatheN 3.4s ease-in-out infinite}
  #fig.idle .armF {animation:breatheF 3.4s ease-in-out infinite}
  #fig.idle .torsoG{animation:breatheT 3.4s ease-in-out infinite}
  @keyframes breatheN{0%,100%{transform:rotate(3deg)}50%{transform:rotate(5.5deg)}}
  @keyframes breatheF{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-1deg)}}
  @keyframes breatheT{0%,100%{transform:rotate(0deg)}50%{transform:rotate(1.2deg)}}

  /* star burst (drawn 8-point stars, no emoji) */
  #stars g{opacity:0;transform-box:fill-box;transform-origin:center}
  #arena.burst #stars g{animation:starpop .95s cubic-bezier(.2,1.4,.4,1) both}
  #arena.burst #stars g:nth-child(2){animation-delay:.09s}
  #arena.burst #stars g:nth-child(3){animation-delay:.18s}
  #arena.burst #stars g:nth-child(4){animation-delay:.27s}
  #arena.burst #stars g:nth-child(5){animation-delay:.14s}
  @keyframes starpop{
    0%{opacity:0;transform:scale(.1) rotate(-40deg)}
    35%{opacity:1;transform:scale(1.15) rotate(6deg)}
    60%{opacity:1;transform:scale(.95) rotate(14deg)}
    100%{opacity:0;transform:scale(.5) rotate(26deg)}
  }
  /* crowd arms wave */
  .swarm{transform-box:fill-box;transform-origin:50% 0%}
  #arena.burst .swarm{animation:crowdwave .55s ease-in-out 3}
  @keyframes crowdwave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(46deg)}}
</style>

var fig = document.getElementById('fig');
var shadowEl = document.getElementById('shadow');
var arena = document.getElementById('arena');
var $ = function(id){ return document.getElementById(id); };

var DIFF_COLOR = {easy:'#7fd6b1', medium:'#f5b46a', hard:'#c896e8'};
var TRICK_DUR = [1500,1600,1500,1600,1600,1600,1500,1450,1500,1700];
var TRICK_NAMES = ['Forward Roll','Aerial Cartwheel','Split Handstand','Pivot Turn',
  'Front Handspring','Forward Walkover','Back Tuck','Twisting Leap','Switch Leap','Split Leap'];
var WB_DUR = 550, FALL_DUR = 1000, GETUP_DUR = 900, SIT_DUR = 1000;
var timers = [];
// hard mode: when on, routines draw only from the 2-digit question set
var bigMode = false;
try { bigMode = localStorage.getItem('avg-big') === '1'; } catch (e) {}

function later(ms, fn){ timers.push(setTimeout(fn, ms)); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function fmt(x){
  var s = (Math.round(x * 100) / 100).toFixed(2);
  if (s.indexOf('.') >= 0){ s = s.replace(/0+$/, '').replace(/\.$/, ''); }
  return s;
}

function unitOf(q){ return q.unit ? q.unit : ''; }

/* ---------------- crowd ---------------- */
(function buildCrowd(){
  var g = document.getElementById('crowd');
  var NS = 'http://www.w3.org/2000/svg';
  var hairs = ['#9a7bd0','#e8a06d','#7fb6e8','#d07fae','#8fce9f','#b3a06e','#8b8bd0','#c98bb5'];
  var shirts = ['#a8c8ef','#e8b8d8','#bfe0c8','#f0d0a0','#cdbde8'];
  var n = 15, i;
  for (i = 0; i < n; i++){
    var cx = 118 + i * 52 + ((i * 37) % 17) - 8;
    var r  = 9 + (i % 3) * 1.5;
    var cy = 234 + ((i * 53) % 7);
    var el;
    el = document.createElementNS(NS,'rect');
    el.setAttribute('x', cx - 13); el.setAttribute('y', cy + 8);
    el.setAttribute('width', 26); el.setAttribute('height', 26);
    el.setAttribute('rx', 9); el.setAttribute('fill', shirts[i % shirts.length]);
    g.appendChild(el);
    el = document.createElementNS(NS,'circle');
    el.setAttribute('cx', cx); el.setAttribute('cy', cy); el.setAttribute('r', r);
    el.setAttribute('fill', hairs[i % hairs.length]);
    g.appendChild(el);
    var armL = document.createElementNS(NS,'line');
    armL.setAttribute('x1', cx - 10); armL.setAttribute('y1', cy + 16);
    armL.setAttribute('x2', cx - 14); armL.setAttribute('y2', cy + 30);
    armL.setAttribute('stroke', hairs[(i+3) % hairs.length]);
    armL.setAttribute('stroke-width', 4.6); armL.setAttribute('stroke-linecap','round');
    armL.setAttribute('class','swarm');
    var armR = document.createElementNS(NS,'line');
    armR.setAttribute('x1', cx + 10); armR.setAttribute('y1', cy + 16);
    armR.setAttribute('x2', cx + 14); armR.setAttribute('y2', cy + 30);
    armR.setAttribute('stroke', hairs[(i+5) % hairs.length]);
    armR.setAttribute('stroke-width', 4.6); armR.setAttribute('stroke-linecap','round');
    armR.setAttribute('class','swarm');
    g.appendChild(armL); g.appendChild(armR);
  }
})();

/* ---------------- figure state machine ---------------- */
function setFig(cls){
  fig.setAttribute('class','');
  shadowEl.setAttribute('class','');
  void fig.getBoundingClientRect();
  fig.setAttribute('class', cls);
  shadowEl.setAttribute('class', cls);
}
// --dur must be set on BOTH fig and the shadow (sibling element - custom
// properties do not flow sideways, and the shadow would default to 1.5s)
function setDur(s){
  fig.style.setProperty('--dur', s);
  shadowEl.style.setProperty('--dur', s);
}
function idleFig(){ setDur('3.4s'); setFig('idle'); }

function playTrick(slot, done){
  var dur = TRICK_DUR[slot];
  setDur((dur/1000) + 's');
  setFig('p' + (slot + 1));
  later(dur * 0.68, burst);
  later(dur, function(){
    setDur((WB_DUR/1000) + 's');
    setFig('wb' + (slot + 1));
    later(WB_DUR, idleFig);
    done();
  });
}
function playFall(done){
  setDur((FALL_DUR/1000)+'s');
  setFig('pfall');
  later(FALL_DUR, done);
}
function playGetup(done){
  setDur((GETUP_DUR/1000)+'s');
  setFig('pgetup');
  later(GETUP_DUR, function(){ idleFig(); done(); });
}
function playSit(done){
  setDur((SIT_DUR/1000)+'s');
  setFig('psit');
  later(SIT_DUR, done);
}
function burst(){
  arena.classList.remove('burst');
  void arena.getBoundingClientRect();
  arena.classList.add('burst');
  later(1500, function(){ arena.classList.remove('burst'); });
}
function banner(text){
  var b = $('banner');
  b.className = ''; b.textContent = text;
  void b.getBoundingClientRect();
  b.className = 'show';
}

/* ---------------- game flow ---------------- */
var routine = [], idx = 0, falls = 0, deductions = 0, locked = true, slots = [];
var queues = null, band = 0, streak = 0, cool = 0, lastFam = '';
var BANDNAME = ['easy','medium','hard'];

// reorder a level-sorted queue so identical question templates (families)
// do not sit next to each other - swaps happen only with close neighbours,
// so the gentle-to-tricky ramp inside the band survives
function spreadFams(a){
  for (var i = 1; i < a.length; i++){
    if (a[i].fam === a[i-1].fam){
      for (var j = i + 1; j < a.length && j <= i + 10; j++){
        if (a[j].fam !== a[i-1].fam){
          var t = a[i]; a[i] = a[j]; a[j] = t; break;
        }
      }
    }
  }
}

function buildPips(){
  var wrap = $('pips');
  wrap.innerHTML = '';
  for (var i = 0; i < 10; i++){
    var d = document.createElement('div');
    d.className = 'pip' + (routine[i] ? ' d-' + routine[i].diff : '');
    d.id = 'pip' + i;
    wrap.appendChild(d);
  }
}
function paintPip(i){
  var p = $('pip' + i);
  p.className = 'pip' + (routine[i] ? ' d-' + routine[i].diff : '');
  if (slots[i] === 'stuck') p.className = 'pip stuck';
  else if (slots[i] === 'fell') p.className = 'pip fell';
  else if (slots[i] === 'revealed') p.className = 'pip revealed';
}
function renderScore(){
  var sc = Math.max(0, 10 - deductions);
  $('score').textContent = sc.toFixed(2);
  $('deduct').textContent = deductions > 0 ? ('deductions -' + deductions.toFixed(2)) : ' ';
}
function lock(on){
  locked = on;
  $('card').classList[on ? 'add' : 'remove']('lock');
  $('ans').disabled = on;
}

function newRoutine(){
  clearTimers();
  // One sorted queue per band: lowest lvl first, random within a tie.
  // Queues hold only the set for the current mode (normal or hard).
  // Questions stay marked used for the whole SESSION (newRoutine does not
  // clear the flags), so back-to-back routines never show repeats; only
  // once all 205 are spent does the bank recycle.
  queues = {};
  BANDNAME.forEach(function(d){
    var a = QUESTIONS.filter(function(q){
      return q.diff === d && (q.big ? 1 : 0) === (bigMode ? 1 : 0);
    });
    shuffle(a);
    a.sort(function(x, y){ return x.lvl - y.lvl; });
    spreadFams(a);                       // break up same-template runs
    queues[d] = a;
  });
  band = 0; streak = 0; cool = 0; lastFam = '';
  routine = []; slots = [];
  for (var i = 0; i < 10; i++){ routine.push(null); slots.push('pending'); }
  idx = 0; deductions = 0;
  renderScore(); buildPips();
  $('endscreen').style.display = 'none';
  $('card').style.display = 'block';
  idleFig();
  ask();
}

// next unused question at the frontier of the current band's queue:
// the gentlest ones not yet seen (a small window keeps variety), and it
// dodges the previous question's template family where possible so the
// wording never repeats back-to-back
function pickNext(){
  function takeFrom(list){
    var cands = [];
    for (var i = 0; i < list.length && cands.length < 8; i++){
      if (!list[i]._used) cands.push(list[i]);   // only never-used candidates
    }
    if (!cands.length) return null;
    var fresh = cands.filter(function(q){ return q.fam !== lastFam; });
    var pool = fresh.length ? fresh : cands.slice(0, 3);   // whole window same family -> take the gentlest
    var q = pool[Math.floor(Math.random() * pool.length)];
    q._used = 1; lastFam = q.fam;
    return q;
  }
  var q = takeFrom(queues[BANDNAME[band]]);
  if (!q){   // band exhausted - borrow the NEAREST band that still has fresh
             // questions (gentler first on a tie), never a random far band
    var order = [0, 1, 2];
    order.sort(function(a, b){ return (Math.abs(a - band) - Math.abs(b - band)) || (a - b); });
    for (var k = 0; k < 3 && !q; k++){
      if (order[k] !== band) q = takeFrom(queues[BANDNAME[order[k]]]);
    }
    if (!q){   // entire bank used this session - recycle it
      QUESTIONS.forEach(function(x){ delete x._used; });
      lastFam = '';
      q = takeFrom(queues[BANDNAME[band]]);
      for (var k = 0; k < 3 && !q; k++){
        if (order[k] !== band) q = takeFrom(queues[BANDNAME[order[k]]]);
      }
    }
  }
  return q;
}

// adaptive difficulty with hysteresis:
//  - a fall drops one level right away (mercy) and resets the streak
//  - climbing needs 3 consecutive clean first-tries, AND while a fresh
//    demotion is cooling down (2 more cleans) the streak does not even
//    build - so one lucky answer after a fall never bounces back up
function adapt(clean){
  if (!clean){
    streak = 0; cool = 2;
    if (band > 0){ band--; return ' The coaches ease the next element down a notch.'; }
    return '';
  }
  if (cool > 0){ cool--; return ''; }
  streak++;
  if (streak >= 3 && band < 2){
    band++; streak = 0;
    return ' Three clean in a row - the coaches step it up!';
  }
  return '';
}

function ask(){
  clearTimers();
  var q = routine[idx] = pickNext();
  falls = 0;
  $('slotline').textContent = 'ELEMENT ' + (idx+1) + ' OF 10  -  ' + q.diff.toUpperCase() +
    (unitOf(q) ? ('  -  ANSWER IN ' + unitOf(q).toUpperCase()) : '');
  $('trickname').textContent = TRICK_NAMES[idx];
  $('stmt').textContent = q.statement;
  $('ans').value = '';
  $('fb').style.display = 'none';
  $('hintbox').style.display = 'none';
  $('btnHint').style.display = 'none';
  $('btnReveal').style.display = 'none';
  paintPip(idx);
  idleFig();
  lock(false);
  $('ans').focus();
}

function submit(){
  if (locked) return;
  var raw = $('ans').value.replace(/,/g, '').trim();
  if (raw === '') return;
  var v = parseFloat(raw);
  if (isNaN(v)) { banner('Type a number!'); return; }
  var q = routine[idx];
  var tol = Math.max(q.tol || 0.011, Math.abs(q.answer) >= 1 ? 0.05 : 0);
  if (Math.abs(v - q.answer) <= tol + 1e-9){
    if (falls === 0) slots[idx] = 'stuck'; else slots[idx] = 'fell';
    paintPip(idx);
    lock(true);
    $('fb').style.display = 'none';
    var tname = TRICK_NAMES[idx];
    playTrick(idx, function(){
      var note = adapt(falls === 0);
      if (falls === 0) banner('STUCK IT!');
      else banner('UP AND LANDED!');
      $('fbtext').innerHTML = (falls === 0
        ? tname + ' - stuck clean! Beautifully landed.'
        : 'Up and landed! The ' + tname.toLowerCase() + ' counted - but the fall deduction stays.')
        + note + '<span class="why">' + q.explain + '</span>';
      $('fb').style.display = 'block';
      $('btnNext').focus();
    });
  } else {
    falls++; deductions++;
    renderScore();
    lock(true);
    banner('OOF!');
    playFall(function(){
      later(900, function(){
        banner('Up she gets!');
        playGetup(function(){ lock(false); $('ans').focus(); });
      });
    });
    if (falls >= 2){
      $('btnHint').style.display = 'inline-block';
      $('hintbox').textContent = 'Hint: ' + routine[idx].explain;
    }
    if (falls >= 3) $('btnReveal').style.display = 'inline-block';
  }
}

function showReveal(){
  if (locked) return;
  lock(true);
  slots[idx] = 'revealed';
  paintPip(idx);
  $('btnHint').style.display = 'none';
  $('btnReveal').style.display = 'none';
  var q = routine[idx];
  var note = adapt(false);
  playSit(function(){
    $('fbtext').innerHTML = 'The answer was ' + fmt(q.answer) + (unitOf(q) ? (' ' + unitOf(q)) : '') +
      '.' + note + '<span class="why">' + q.explain + '</span>';
    $('fb').style.display = 'block';
    $('btnNext').focus();
  });
}

function nextSlot(){
  idx++;
  if (idx >= 10) endScreen(); else ask();
}

function endScreen(){
  clearTimers();
  $('card').style.display = 'none';
  idleFig();
  var score = Math.max(0, 10 - deductions);
  var clean = slots.filter(function(s){ return s === 'stuck'; }).length;
  var fallsTotal = deductions;
  var title = score >= 9.5 ? 'FLAWLESS ROUTINE'
            : score >= 8  ? 'Brilliant routine'
            : score >= 6  ? 'Solid routine'
            : 'Keep training';
  $('endtitle').textContent = title;
  $('endscore').textContent = score.toFixed(2) + ' / 10.00';
  var tb = '';
  for (var i = 0; i < 10; i++){
    var c = slots[i] === 'stuck' ? '' : (slots[i] === 'fell' ? ' f' : (slots[i] === 'revealed' ? ' r' : ''));
    tb += '<div class="tb' + c + '"></div>';
  }
  $('tbline').innerHTML = tb;
  $('endline').textContent = clean + ' of 10 elements stuck clean.';
  $('enddetail').textContent = fallsTotal > 0
    ? ('Deduction summary: ' + fallsTotal + ' fall' + (fallsTotal > 1 ? 's' : '') +
      ' at -1.00 each = -' + fallsTotal.toFixed(2) + '.')
    : 'Deduction summary: not a single fall. The judges are speechless.';
  $('endscreen').style.display = 'block';
  if (clean >= 8){ burst(); banner('WOW!'); }
  $('btnAgain').focus();
}

/* ---------------- wiring ---------------- */
$('btn').addEventListener('click', submit);
$('ans').addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
$('btnNext').addEventListener('click', nextSlot);
$('btnAgain').addEventListener('click', newRoutine);
$('btnMode').addEventListener('click', function(){
  bigMode = !bigMode;
  try { localStorage.setItem('avg-big', bigMode ? '1' : '0'); } catch (e) {}
  paintMode();
  newRoutine();          // fresh routine drawn from the new number pool
});
function paintMode(){
  $('btnMode').textContent = 'hard mode: ' + (bigMode ? 'on' : 'off');
  $('btnMode').className = bigMode ? 'on' : '';
}
paintMode();
$('btnReveal').addEventListener('click', showReveal);
$('btnHint').addEventListener('click', function(){
  var h = $('hintbox');
  h.style.display = h.style.display === 'block' ? 'none' : 'block';
});

// phones: crop the scene camera around her actual travel lane (measured
// x-range 360..822 of 960), so she stays big instead of shrinking with width
var mqPhone = window.matchMedia('(max-width:640px)');
function fitScene(){
  $('scene').setAttribute('viewBox', mqPhone.matches ? '330 0 540 360' : '0 0 960 360');
}
if (mqPhone.addEventListener) mqPhone.addEventListener('change', fitScene);
else if (mqPhone.addListener) mqPhone.addListener(fitScene);
fitScene();

newRoutine();
</script>
</body>
